services:
  thermal-helper:
    build:
      context: .
      tags:
        - thermal_helper
    image: thermal_helper
    container_name: thermal-helper
    ports:
      - "8601:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      # Ollama configuration
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://172.17.0.1:11435}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma:2b}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
