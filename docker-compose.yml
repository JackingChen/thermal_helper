services:
  thermal-helper:
    build:
      context: .
      tags:
        - thermal_helper
    image: thermal_helper
    container_name: thermal-helper
    ports:
      - "8601:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      # Azure OpenAI credentials — set these before running
      # Alternatively create a .env file: AZURE_OPENAI_KEY=your_key_here
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-https://gpt4fordg.openai.azure.com}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
